[project]
name = "trustworthy-llm-architecture-lab"
version = "0.2.0"
description = "Research software for trustworthy LLM-enabled logistics incident management."
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["scikit-learn>=1.7.2,<2"]

[project.optional-dependencies]
test = ["pytest>=8.4.2,<9"]
transformer = ["torch>=2.8.0,<3", "transformers>=5.10.0,<6"]
dense = ["sentence-transformers>=5.6.0,<6"]

[project.scripts]
trustworthy-llm-generate-data = "trustworthy_llm.generate:main"
trustworthy-llm-experiment = "trustworthy_llm.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
